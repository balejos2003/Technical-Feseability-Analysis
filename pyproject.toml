[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-feasibility-analysis"
version = "0.1.0"
description = "Interactive, evidence-traceable technical feasibility analysis"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<2.0",
]

[project.scripts]
feasibility = "feasibility.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
